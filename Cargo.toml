[workspace]
resolver = "3"
members = [
    "apps/codex-notifier",
    "crates/application",
    "crates/codex-source",
    "crates/config",
    "crates/core",
    "crates/ipc",
    "crates/native-notification",
    "crates/persistence",
    "crates/ssh-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
toml = "0.9.5"
unicode-normalization = "0.1.24"
uuid = "1.16.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
