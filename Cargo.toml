[workspace]
resolver = "3"
members = [
    "apps/codex-notifier",
    "crates/application",
    "crates/codex-source",
    "crates/config",
    "crates/core",
    "crates/ipc",
    "crates/native-notification",
    "crates/persistence",
    "crates/ssh-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
interprocess = { version = "2.4.2", features = ["tokio"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "alloc",
    "NSBundle",
    "NSDate",
    "NSRunLoop",
    "NSString",
] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
rusqlite = { version = "0.37.0", features = ["bundled"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "1.46.1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9.5"
unicode-normalization = "0.1.24"
uuid = { version = "1.16.0", features = ["v7"] }
usernotifications-rs = "=0.2.0"
widestring = "1.2.0"
windows = "0.61.3"

[workspace.dependencies.tempfile]
version = "3.20.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
