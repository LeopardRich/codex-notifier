name: Desktop lifecycle probe

on:
  push:
    branches:
      - stage-14/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build first installer
        run: cargo build -p codex-notifier

      - name: Exercise Windows install, restart, upgrade, and uninstall
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path target\lifecycle-evidence -Force | Out-Null
          $source = (Resolve-Path target\debug\codex-notifier.exe).Path
          $hooks = Join-Path $env:USERPROFILE '.codex\hooks.json'
          $hooksBefore = 'target\lifecycle-evidence\windows-hooks-before.json'
          $hooksExisted = Test-Path -LiteralPath $hooks
          if ($hooksExisted) { Copy-Item -LiteralPath $hooks -Destination $hooksBefore }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Codex Notifier\codex-notifier.exe'
          $state = Join-Path $env:LOCALAPPDATA 'codex-notifier'
          $config = Join-Path $env:APPDATA 'codex-notifier\config.toml'
          $manifest = Join-Path $state 'install-manifest.json'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Codex Notifier.lnk'
          $identity = 'HKCU:\Software\Classes\AppUserModelId\LeopardRich.CodexNotifier'
          try {
            & $source install --codex-version 0.144.5 2>&1 |
              Set-Content target\lifecycle-evidence\windows-install.txt
            if ($LASTEXITCODE -ne 0) { throw 'initial install failed' }
            & $source status |
              Set-Content target\lifecycle-evidence\windows-status-installed.txt
            if (-not (Select-String -Quiet -Path target\lifecycle-evidence\windows-status-installed.txt -Pattern '^agent_running=true$')) {
              throw 'installed agent is not running'
            }
            $nativeReady = Select-String -Quiet -Path target\lifecycle-evidence\windows-status-installed.txt -Pattern '^notification=ready$'
            if (-not (Test-Path -LiteralPath $shortcut) -or -not (Test-Path -LiteralPath $identity)) {
              throw 'Windows notification identity is incomplete'
            }
            $indexed = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if (Get-StartApps | Where-Object AppID -eq 'LeopardRich.CodexNotifier') {
                $indexed = $true
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $indexed) {
              throw 'Start Menu did not index the product AUMID'
            }
            $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name CodexNotifier
            if (-not $run.CodexNotifier.Contains($installed)) { throw 'startup command is incorrect' }

            & $installed test task-completed |
              Set-Content target\lifecycle-evidence\windows-test-before-upgrade.txt
            Start-Sleep -Milliseconds 750
            & $source status |
              Set-Content target\lifecycle-evidence\windows-status-after-test.txt
            $expectedReceipts = if ($nativeReady) { 1 } else { 0 }
            if (-not (Select-String -Quiet -Path target\lifecycle-evidence\windows-status-after-test.txt -Pattern "^delivery_receipts=$expectedReceipts`$")) {
              throw 'task-completion test was not delivered'
            }
            $firstHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash

            $env:CARGO_TARGET_DIR = 'target\upgrade'
            $env:RUSTFLAGS = '-C metadata=stage14-upgrade'
            cargo build -p codex-notifier
            if ($LASTEXITCODE -ne 0) { throw 'upgrade build failed' }
            $upgrade = (Resolve-Path target\upgrade\debug\codex-notifier.exe).Path
            & $upgrade install --codex-version 0.144.5 2>&1 |
              Set-Content target\lifecycle-evidence\windows-upgrade.txt
            if ($LASTEXITCODE -ne 0) { throw 'upgrade install failed' }
            $secondHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash
            if ($firstHash -eq $secondHash) { throw 'installed executable was not replaced' }

            Set-Content -LiteralPath (Join-Path $state 'agent-shutdown-request') -Value stop
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            do {
              Start-Sleep -Milliseconds 100
              $status = & $upgrade status | Out-String
            } while ($status -match 'agent_running=true' -and [DateTime]::UtcNow -lt $deadline)
            if ($status -match 'agent_running=true') { throw 'agent did not stop for restart' }
            Start-Process -FilePath $installed -ArgumentList agent -WindowStyle Hidden
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            do {
              Start-Sleep -Milliseconds 100
              $status = & $upgrade status | Out-String
            } while ($status -notmatch 'agent_running=true' -and [DateTime]::UtcNow -lt $deadline)
            if ($status -notmatch 'agent_running=true') { throw 'agent did not restart' }
            $status | Set-Content target\lifecycle-evidence\windows-status-after-restart.txt

            & $installed test approval-requested |
              Set-Content target\lifecycle-evidence\windows-test-after-upgrade.txt
            Start-Sleep -Milliseconds 750
            & $upgrade status |
              Set-Content target\lifecycle-evidence\windows-status-after-upgrade.txt
            $expectedReceipts = if ($nativeReady) { 2 } else { 0 }
            if (-not (Select-String -Quiet -Path target\lifecycle-evidence\windows-status-after-upgrade.txt -Pattern "^delivery_receipts=$expectedReceipts`$")) {
              throw 'queue/receipt state did not survive upgrade and restart'
            }

            & $upgrade uninstall 2>&1 |
              Set-Content target\lifecycle-evidence\windows-uninstall.txt
            if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
            if ((Test-Path -LiteralPath $installed) -or (Test-Path -LiteralPath $shortcut) -or
                (Test-Path -LiteralPath $identity) -or (Test-Path -LiteralPath $manifest) -or
                (Test-Path -LiteralPath $config)) {
              throw 'owned Windows resources remain after uninstall'
            }
            if (-not (Test-Path -LiteralPath (Join-Path $state 'events.sqlite3'))) {
              throw 'event state was not preserved'
            }
            if ($hooksExisted) {
              $env:BEFORE_HOOKS = (Resolve-Path $hooksBefore).Path
              $env:CURRENT_HOOKS = $hooks
              node -e "const fs=require('fs');const s=x=>Array.isArray(x)?x.map(s):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,s(x[k])])):x;if(JSON.stringify(s(JSON.parse(fs.readFileSync(process.env.BEFORE_HOOKS))))!==JSON.stringify(s(JSON.parse(fs.readFileSync(process.env.CURRENT_HOOKS)))))process.exit(1)"
              if ($LASTEXITCODE -ne 0) { throw 'pre-existing hooks changed semantically' }
            } elseif (Test-Path -LiteralPath $hooks) {
              throw 'installer-created hook file remains after uninstall'
            }
            @(
              'install=true'
              "native_delivery=$nativeReady"
              'idempotent_upgrade=true'
              'startup_restart=true'
              'approval_submission_after_upgrade=true'
              'uninstall=true'
              'state_preserved=true'
              'hooks_preserved=true'
            ) | Set-Content target\lifecycle-evidence\windows-result.txt
          }
          finally {
            if (Test-Path -LiteralPath $manifest) {
              & $source uninstall *> $null
            }
          }

      - name: Upload Windows lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-lifecycle
          path: target/lifecycle-evidence/windows-*
          if-no-files-found: error

  macos-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-14
            os: macos-14
          - name: macos-latest
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Enable hosted Notification Center UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/lifecycle-evidence
          uid="$(id -u)"
          agent='com.apple.notificationcenterui.agent'
          plist='/System/Library/LaunchAgents/com.apple.notificationcenterui.plist'
          if launchctl print-disabled "gui/$uid" | grep -q '"com.apple.notificationcenterui.agent" => disabled'; then
            echo disabled >target/lifecycle-evidence/macos-notificationcenterui-original.txt
            launchctl enable "gui/$uid/$agent"
          else
            echo enabled >target/lifecycle-evidence/macos-notificationcenterui-original.txt
          fi
          if ! launchctl print "gui/$uid/$agent" >/dev/null 2>&1; then
            launchctl bootstrap "gui/$uid" "$plist"
          fi
          launchctl kickstart -k "gui/$uid/$agent"
          screencapture -x target/lifecycle-evidence/macos-screen-preflight.png 2>/dev/null || true
          xcrun swiftc .github/scripts/macos-lifecycle-click.swift -o target/macos-lifecycle-click

      - name: Create temporary trusted signing identity
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/codex-notifier-signing"
          keychain="$RUNNER_TEMP/codex-notifier-probe.keychain-db"
          password='codex-notifier-probe'
          mkdir -p "$directory"
          cat >"$directory/root.cnf" <<'EOF'
          [req]
          distinguished_name=subject
          x509_extensions=extensions
          prompt=no
          [subject]
          CN=Codex Notifier Probe Root
          O=Codex Notifier Probe
          [extensions]
          basicConstraints=critical,CA:true
          keyUsage=critical,keyCertSign,cRLSign
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid:always
          EOF
          cat >"$directory/leaf.cnf" <<'EOF'
          [req]
          distinguished_name=subject
          prompt=no
          [subject]
          CN=Codex Notifier Probe Signing
          OU=CODEXPRB01
          O=Codex Notifier Probe
          [extensions]
          basicConstraints=critical,CA:false
          keyUsage=critical,digitalSignature
          extendedKeyUsage=codeSigning
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid,issuer
          EOF
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 -config "$directory/root.cnf" -keyout "$directory/root.key" -out "$directory/root.pem"
          openssl req -new -newkey rsa:2048 -nodes -sha256 -config "$directory/leaf.cnf" -keyout "$directory/leaf.key" -out "$directory/leaf.csr"
          openssl x509 -req -sha256 -days 1 -in "$directory/leaf.csr" -CA "$directory/root.pem" -CAkey "$directory/root.key" -CAcreateserial -extfile "$directory/leaf.cnf" -extensions extensions -out "$directory/leaf.pem"
          pkcs12_options=()
          if [[ "$(openssl version)" == "OpenSSL 3."* ]]; then
            pkcs12_options=(-legacy)
          fi
          openssl pkcs12 -export "${pkcs12_options[@]}" -inkey "$directory/leaf.key" -in "$directory/leaf.pem" -certfile "$directory/root.pem" -out "$directory/leaf.p12" -passout "pass:$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$directory/leaf.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          login_keychain=$(security default-keychain -d user | tr -d '"')
          security list-keychains -d user -s "$keychain" "$login_keychain"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$directory/root.pem"
          identity=$(openssl x509 -in "$directory/leaf.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          root_identity=$(openssl x509 -in "$directory/root.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          {
            echo "CODEX_LIFECYCLE_SIGNING_DIRECTORY=$directory"
            echo "CODEX_LIFECYCLE_SIGNING_KEYCHAIN=$keychain"
            echo "CODEX_LIFECYCLE_SIGNING_IDENTITY=$identity"
            echo "CODEX_LIFECYCLE_SIGNING_ROOT=$root_identity"
          } >>"$GITHUB_ENV"

      - name: Build signed source application
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p codex-notifier
          bundle="$RUNNER_TEMP/Codex Notifier.app"
          mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
          cp target/debug/codex-notifier "$bundle/Contents/MacOS/codex-notifier"
          chmod 755 "$bundle/Contents/MacOS/codex-notifier"
          cat >"$bundle/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDisplayName</key><string>Codex Notifier</string>
          <key>CFBundleExecutable</key><string>codex-notifier</string>
          <key>CFBundleIdentifier</key><string>io.github.leopardrich.codex-notifier</string>
          <key>CFBundleName</key><string>Codex Notifier</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>0.1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSMinimumSystemVersion</key><string>14.0</string>
          <key>LSUIElement</key><true/>
          <key>CFBundleIconFile</key><string>codex-notifier</string>
          </dict></plist>
          EOF
          cp /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/AlertNoteIcon.icns "$bundle/Contents/Resources/codex-notifier.icns"
          codesign --force --deep --sign "$CODEX_LIFECYCLE_SIGNING_IDENTITY" --keychain "$CODEX_LIFECYCLE_SIGNING_KEYCHAIN" --identifier io.github.leopardrich.codex-notifier "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          echo "CODEX_LIFECYCLE_SOURCE_BUNDLE=$bundle" >>"$GITHUB_ENV"

      - name: Exercise macOS install and authorization
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          source_executable="$CODEX_LIFECYCLE_SOURCE_BUNDLE/Contents/MacOS/codex-notifier"
          hooks="$HOME/.codex/hooks.json"
          if [[ -f "$hooks" ]]; then
            cp "$hooks" target/lifecycle-evidence/macos-hooks-before.json
            echo true >target/lifecycle-evidence/macos-hooks-existed.txt
          else
            echo false >target/lifecycle-evidence/macos-hooks-existed.txt
          fi
          "$source_executable" install --codex-version 0.144.5 >target/lifecycle-evidence/macos-install.txt 2>&1 &
          install_pid=$!
          banner_hovered=''
          banner_pressed=''
          settings_app_pressed=''
          settings_allow_pressed=''
          screen_pressed=''
          for attempt in $(seq 1 100); do
            [[ -e "$HOME/Library/Application Support/codex-notifier/state/install-manifest.json" ]] && break
            sleep 0.1
          done
          open 'x-apple.systempreferences:com.apple.Notifications-Settings.extension?id=io.github.leopardrich.codex-notifier' || true
          banner_pressed=1
          for attempt in $(seq 1 100); do
            if "$source_executable" status 2>/dev/null | grep -q '^notification=ready$'; then break; fi
            CODEX_LIFECYCLE_CLICK_HELPER="$PWD/target/macos-lifecycle-click" \
            CODEX_LIFECYCLE_BANNER_HOVERED="$banner_hovered" \
            CODEX_LIFECYCLE_BANNER_PRESSED="$banner_pressed" \
            CODEX_LIFECYCLE_SETTINGS_APP_PRESSED="$settings_app_pressed" \
            CODEX_LIFECYCLE_SETTINGS_ALLOW_PRESSED="$settings_allow_pressed" \
            CODEX_LIFECYCLE_SCREEN_PRESSED="$screen_pressed" \
            CODEX_LIFECYCLE_OBSERVE_TEXT='' \
              osascript .github/scripts/macos-lifecycle-ui.applescript >target/lifecycle-evidence/macos-ui-current.txt 2>&1 || true
            cat target/lifecycle-evidence/macos-ui-current.txt >>target/lifecycle-evidence/macos-ui-history.txt
            if grep -q '^pressed=screen' target/lifecycle-evidence/macos-ui-current.txt; then screen_pressed=1; fi
            if grep -q '^pressed=notification-allow' target/lifecycle-evidence/macos-ui-current.txt; then settings_allow_pressed=1; fi
            if grep -q '^hovered=banner' target/lifecycle-evidence/macos-ui-current.txt; then banner_hovered=1; sleep 2; continue; fi
            if grep -q '^pressed=banner' target/lifecycle-evidence/macos-ui-current.txt; then banner_pressed=1; sleep 2; continue; fi
            if grep -q '^pressed=settings-app' target/lifecycle-evidence/macos-ui-current.txt; then settings_app_pressed=1; sleep 2; continue; fi
            if grep -q '^pressed=settings-allow' target/lifecycle-evidence/macos-ui-current.txt; then settings_allow_pressed=1; settings_app_pressed=1; sleep 2; continue; fi
            sleep 0.5
          done
          wait "$install_pid"
          "$source_executable" status >target/lifecycle-evidence/macos-status-installed.txt
          grep -q '^installed=true$' target/lifecycle-evidence/macos-status-installed.txt
          grep -q '^agent_running=true$' target/lifecycle-evidence/macos-status-installed.txt
          grep -q '^notification=ready$' target/lifecycle-evidence/macos-status-installed.txt

      - name: Exercise macOS delivery, restart, upgrade, and uninstall
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          source_executable="$CODEX_LIFECYCLE_SOURCE_BUNDLE/Contents/MacOS/codex-notifier"
          installed="$HOME/Applications/Codex Notifier.app/Contents/MacOS/codex-notifier"
          state="$HOME/Library/Application Support/codex-notifier/state"
          plist="$HOME/Library/LaunchAgents/io.github.leopardrich.codex-notifier.plist"
          uid="$(id -u)"
          "$installed" test task-completed >target/lifecycle-evidence/macos-test-before-upgrade.txt
          observed=''
          for attempt in $(seq 1 40); do
            CODEX_LIFECYCLE_CLICK_HELPER="$PWD/target/macos-lifecycle-click" \
            CODEX_LIFECYCLE_BANNER_HOVERED=1 CODEX_LIFECYCLE_BANNER_PRESSED=1 \
            CODEX_LIFECYCLE_SETTINGS_APP_PRESSED=1 CODEX_LIFECYCLE_SETTINGS_ALLOW_PRESSED=1 \
            CODEX_LIFECYCLE_SCREEN_PRESSED=1 CODEX_LIFECYCLE_OBSERVE_TEXT='Codex task finished' \
              osascript .github/scripts/macos-lifecycle-ui.applescript >target/lifecycle-evidence/macos-observe-current.txt 2>&1 || true
            if grep -q '^observed=notification' target/lifecycle-evidence/macos-observe-current.txt; then observed=1; break; fi
            sleep 0.25
          done
          [[ "$observed" == 1 ]]
          screencapture -x target/lifecycle-evidence/macos-task-completed.png
          sleep 1
          "$source_executable" status >target/lifecycle-evidence/macos-status-after-test.txt
          grep -q '^delivery_receipts=1$' target/lifecycle-evidence/macos-status-after-test.txt
          first_hash=$(shasum -a 256 "$installed" | cut -d' ' -f1)

          touch "$state/agent-shutdown-request"
          for attempt in $(seq 1 100); do
            if ! "$source_executable" status | grep -q '^agent_running=true$'; then break; fi
            sleep 0.1
          done
          launchctl bootout "gui/$uid/io.github.leopardrich.codex-notifier" 2>/dev/null || true
          launchctl bootstrap "gui/$uid" "$plist"
          for attempt in $(seq 1 100); do
            if "$source_executable" status | grep -q '^agent_running=true$'; then break; fi
            sleep 0.1
          done
          "$source_executable" status >target/lifecycle-evidence/macos-status-after-restart.txt
          grep -q '^agent_running=true$' target/lifecycle-evidence/macos-status-after-restart.txt

          CARGO_TARGET_DIR=target/upgrade RUSTFLAGS='-C metadata=stage14-upgrade' cargo build -p codex-notifier
          cp target/upgrade/debug/codex-notifier "$source_executable"
          chmod 755 "$source_executable"
          codesign --force --deep --sign "$CODEX_LIFECYCLE_SIGNING_IDENTITY" --keychain "$CODEX_LIFECYCLE_SIGNING_KEYCHAIN" --identifier io.github.leopardrich.codex-notifier "$CODEX_LIFECYCLE_SOURCE_BUNDLE"
          "$source_executable" install --codex-version 0.144.5 >target/lifecycle-evidence/macos-upgrade.txt
          second_hash=$(shasum -a 256 "$installed" | cut -d' ' -f1)
          [[ "$first_hash" != "$second_hash" ]]
          "$installed" test approval-requested >target/lifecycle-evidence/macos-test-after-upgrade.txt
          sleep 1
          "$source_executable" status >target/lifecycle-evidence/macos-status-after-upgrade.txt
          grep -q '^delivery_receipts=2$' target/lifecycle-evidence/macos-status-after-upgrade.txt

          "$source_executable" uninstall >target/lifecycle-evidence/macos-uninstall.txt
          [[ ! -e "$HOME/Applications/Codex Notifier.app" ]]
          [[ ! -e "$plist" ]]
          [[ ! -e "$HOME/Library/Application Support/codex-notifier/config.toml" ]]
          [[ ! -e "$state/install-manifest.json" ]]
          [[ -e "$state/events.sqlite3" ]]
          if [[ "$(cat target/lifecycle-evidence/macos-hooks-existed.txt)" == true ]]; then
            BEFORE_HOOKS="$PWD/target/lifecycle-evidence/macos-hooks-before.json" CURRENT_HOOKS="$HOME/.codex/hooks.json" node -e "const fs=require('fs');const s=x=>Array.isArray(x)?x.map(s):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,s(x[k])])):x;if(JSON.stringify(s(JSON.parse(fs.readFileSync(process.env.BEFORE_HOOKS))))!==JSON.stringify(s(JSON.parse(fs.readFileSync(process.env.CURRENT_HOOKS)))))process.exit(1)"
          else
            [[ ! -e "$HOME/.codex/hooks.json" ]]
          fi
          printf '%s\n' install=true task_delivery=true startup_restart=true upgrade=true approval_delivery_after_upgrade=true uninstall=true state_preserved=true hooks_preserved=true >target/lifecycle-evidence/macos-result.txt

      - name: Cleanup hosted macOS session
        if: always()
        shell: bash
        run: |
          set +e
          source_executable="$CODEX_LIFECYCLE_SOURCE_BUNDLE/Contents/MacOS/codex-notifier"
          if [[ -x "$source_executable" && -e "$HOME/Library/Application Support/codex-notifier/state/install-manifest.json" ]]; then
            "$source_executable" uninstall >/dev/null 2>&1
          fi
          launchctl bootout "gui/$(id -u)/io.github.leopardrich.codex-notifier" 2>/dev/null
          rm -rf "$HOME/Applications/Codex Notifier.app"
          rm -f "$HOME/Library/LaunchAgents/io.github.leopardrich.codex-notifier.plist"
          if [[ -n "${CODEX_LIFECYCLE_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$CODEX_LIFECYCLE_SIGNING_KEYCHAIN"; fi
          login_keychain=$(security default-keychain -d user | tr -d '"')
          if [[ -n "$login_keychain" ]]; then security list-keychains -d user -s "$login_keychain"; fi
          if [[ -n "${CODEX_LIFECYCLE_SIGNING_ROOT:-}" ]]; then sudo security delete-certificate -Z "$CODEX_LIFECYCLE_SIGNING_ROOT" /Library/Keychains/System.keychain; fi
          rm -rf "${CODEX_LIFECYCLE_SIGNING_DIRECTORY:-}"
          if grep -q '^disabled$' target/lifecycle-evidence/macos-notificationcenterui-original.txt 2>/dev/null; then
            uid="$(id -u)"
            launchctl bootout "gui/$uid/com.apple.notificationcenterui.agent" 2>/dev/null
            launchctl disable "gui/$uid/com.apple.notificationcenterui.agent"
          fi

      - name: Upload macOS lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-desktop-lifecycle
          path: target/lifecycle-evidence/macos-*
          if-no-files-found: error
