name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-desktop
            os: windows-latest
          - target: macos-latest-desktop
            os: macos-latest
          - target: macos-14-desktop
            os: macos-14
          - target: linux-relay
            os: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Verify Windows Session 0 diagnostic
        if: matrix.target == 'windows-desktop'
        shell: pwsh
        run: |
          cargo test -p codex-notifier-native-notification --test windows_smoke --no-run
          $testBinary = Get-ChildItem target\debug\deps\windows_smoke-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $testBinary) { throw 'Windows smoke test binary was not built' }

          $taskName = "codex-notifier-session0-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $action = New-ScheduledTaskAction `
            -Execute $testBinary.FullName `
            -Argument '--exact reports_real_non_interactive_session --ignored --nocapture'
          $principal = New-ScheduledTaskPrincipal `
            -UserId 'SYSTEM' `
            -LogonType ServiceAccount `
            -RunLevel Highest
          try {
            Register-ScheduledTask `
              -TaskName $taskName `
              -Action $action `
              -Principal $principal `
              -Force | Out-Null
            Start-ScheduledTask -TaskName $taskName
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            do {
              Start-Sleep -Milliseconds 250
              $task = Get-ScheduledTask -TaskName $taskName
              $info = Get-ScheduledTaskInfo -TaskName $taskName
            } while ($task.State -eq 'Running' -and [DateTime]::UtcNow -lt $deadline)
            if ($task.State -eq 'Running') { throw 'Session 0 diagnostic timed out' }
            if ($info.LastTaskResult -ne 0) {
              throw "Session 0 diagnostic failed with exit code $($info.LastTaskResult)"
            }
          }
          finally {
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }

      - name: Build macOS notification smoke tests
        if: startsWith(matrix.target, 'macos-')
        run: cargo test -p codex-notifier-native-notification --test macos_smoke --no-run

      - name: Verify macOS no-Aqua diagnostic
        if: startsWith(matrix.target, 'macos-')
        run: cargo test -p codex-notifier-native-notification --test macos_smoke reports_real_no_gui_session -- --ignored --exact --nocapture
