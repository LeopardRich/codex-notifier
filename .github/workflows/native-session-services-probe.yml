name: Native session services probe

on:
  push:
    branches:
      - platform-probe/native-session-services

permissions:
  contents: read

jobs:
  windows-11:
    name: Windows 11 Arm64 identity index
    runs-on: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Complete hosted Windows first-login UI
        shell: pwsh
        run: |
          New-Item -Path target -ItemType Directory -Force | Out-Null
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public static class ProbeMouse
          {
              [DllImport("user32.dll")]
              public static extern bool SetCursorPos(int x, int y);

              [DllImport("user32.dll")]
              public static extern void mouse_event(
                  uint flags, uint dx, uint dy, uint data, UIntPtr extraInfo);

              public static void Click(int x, int y)
              {
                  SetCursorPos(x, y);
                  mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);
                  mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
              }
          }
          '@

          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $condition = New-Object System.Windows.Automation.PropertyCondition(
            [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
            [System.Windows.Automation.ControlType]::Button)
          $invoked = 0
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            $buttons = $root.FindAll(
              [System.Windows.Automation.TreeScope]::Descendants,
              $condition)
            "Attempt=$attempt" | Add-Content target\windows11-first-login.log
            @($buttons | ForEach-Object {
              "Name=$($_.Current.Name) AutomationId=$($_.Current.AutomationId) Enabled=$($_.Current.IsEnabled)"
            }) | Add-Content target\windows11-first-login.log
            $candidate = $buttons | Where-Object {
              $_.Current.IsEnabled -and
              $_.Current.Name -in @('Next', 'Accept', 'Continue')
            } | Select-Object -First 1
            if (-not $candidate) { break }
            $pattern = [System.Windows.Automation.InvokePattern]$candidate.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)
            $pattern.Invoke()
            $invoked += 1
            Start-Sleep -Seconds 2
          }

          if ($invoked -eq 0) {
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $x = $screen.Left + [int]($screen.Width * 0.846)
            $y = $screen.Top + [int]($screen.Height * 0.855)
            for ($click = 0; $click -lt 2; $click++) {
              "CoordinateClick=$click X=$x Y=$y" |
                Add-Content target\windows11-first-login.log
              [ProbeMouse]::Click($x, $y)
              Start-Sleep -Seconds 4
            }
          }

          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) {
            Start-Process explorer.exe
            Start-Sleep -Seconds 3
          }
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build Windows smoke executable
        run: cargo test -p codex-notifier-native-notification --test windows_smoke --no-run

      - name: Exercise indexed install-grade identity
        id: windows-smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $aumid = 'LeopardRich.CodexNotifier'
          $identityKey = "HKCU:\Software\Classes\AppUserModelId\$aumid"
          $programs = [Environment]::GetFolderPath('Programs')
          $shortcut = Join-Path $programs 'Codex Notifier.lnk'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Codex Notifier Probe'
          $installedBinary = Join-Path $installDir 'codex-notifier.exe'
          $iconPath = Join-Path $installDir 'codex-notifier.png'
          $arguments = '--exact displays_task_completion_and_approval_request_toasts --ignored --nocapture'
          $testBinary = Get-ChildItem target\debug\deps\windows_smoke-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $testBinary) { throw 'Windows smoke executable was not built' }

          $os = Get-CimInstance Win32_OperatingSystem
          @(
            "Caption=$($os.Caption)"
            "Version=$($os.Version)"
            "Build=$($os.BuildNumber)"
            "ProcessArchitecture=$([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
            "SessionId=$((Get-Process -Id $PID).SessionId)"
            "Programs=$programs"
          ) | Set-Content target\windows11-host.txt

          $exitCode = 1
          try {
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
            Copy-Item -LiteralPath $testBinary.FullName -Destination $installedBinary
            Add-Type -AssemblyName System.Drawing
            $icon = New-Object System.Drawing.Bitmap(64, 64)
            $graphics = [System.Drawing.Graphics]::FromImage($icon)
            try {
              $graphics.Clear([System.Drawing.Color]::FromArgb(0, 120, 212))
              $icon.Save($iconPath, [System.Drawing.Imaging.ImageFormat]::Png)
            }
            finally {
              $graphics.Dispose()
              $icon.Dispose()
            }

            & .github\scripts\windows-toast-probe-identity.ps1 `
              -Mode Create `
              -ShortcutPath $shortcut `
              -TargetPath $installedBinary `
              -TargetArguments $arguments `
              -IconPath $iconPath

            $indexed = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $entry = Get-StartApps | Where-Object AppID -eq $aumid
              if ($entry) {
                "IndexedBeforeRestart=$($entry.Name):$($entry.AppID)" |
                  Add-Content target\windows11-identity.txt
                $indexed = $true
                break
              }
              Start-Sleep -Seconds 1
            }

            if (-not $indexed) {
              'Start Apps index missing before Shell restart' |
                Add-Content target\windows11-identity.txt
              Get-Process StartMenuExperienceHost -ErrorAction SilentlyContinue |
                Stop-Process -Force
              Get-Process explorer -ErrorAction SilentlyContinue |
                Stop-Process -Force
              Start-Process explorer.exe
              for ($attempt = 0; $attempt -lt 60; $attempt++) {
                $entry = Get-StartApps | Where-Object AppID -eq $aumid
                if ($entry) {
                  "IndexedAfterRestart=$($entry.Name):$($entry.AppID)" |
                    Add-Content target\windows11-identity.txt
                  $indexed = $true
                  break
                }
                Start-Sleep -Seconds 1
              }
            }

            $shell = New-Object -ComObject Shell.Application
            $shortcutFolder = $shell.Namespace((Split-Path $shortcut))
            $shortcutItem = $shortcutFolder.ParseName((Split-Path $shortcut -Leaf))
            $appsFolder = $shell.Namespace('shell:AppsFolder')
            $appsItem = @($appsFolder.Items()) | Where-Object {
              $_.ExtendedProperty('System.AppUserModel.ID') -eq $aumid
            } | Select-Object -First 1
            @(
              "ShortcutExists=$(Test-Path -LiteralPath $shortcut)"
              "ShortcutAppId=$($shortcutItem.ExtendedProperty('System.AppUserModel.ID'))"
              "RegistryIdentity=$(Test-Path -LiteralPath $identityKey)"
              "StartAppsIndexed=$indexed"
              "AppsFolderItem=$($appsItem.Name)"
              "AppsFolderPath=$($appsItem.Path)"
            ) | Add-Content target\windows11-identity.txt

            $process = Start-Process -FilePath $shortcut -PassThru -Wait
            $exitCode = $process.ExitCode
            "ShortcutExitCode=$exitCode" | Set-Content target\windows11-smoke.log
            if ($exitCode -ne 0) {
              $productOutput = & $installedBinary `
                --exact displays_task_completion_and_approval_request_toasts `
                --ignored `
                --nocapture 2>&1
              $directCode = $LASTEXITCODE
              $productOutput | Add-Content target\windows11-smoke.log
              "DirectExitCode=$directCode" | Add-Content target\windows11-smoke.log
              $exitCode = $directCode
            }

            function Save-ProbeScreen([string] $Path) {
              $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bitmap = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
              $screenGraphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $screenGraphics.CopyFromScreen($screen.Left, $screen.Top, 0, 0, $bitmap.Size)
                $bitmap.Save($Path, [System.Drawing.Imaging.ImageFormat]::Png)
              }
              finally {
                $screenGraphics.Dispose()
                $bitmap.Dispose()
              }
            }

            Add-Type -AssemblyName System.Windows.Forms
            Start-Sleep -Seconds 2
            Save-ProbeScreen 'target\windows11-screen.png'

            Add-Type -TypeDefinition @'
            using System;
            using System.Runtime.InteropServices;

            public static class ProbeNotificationCenter
            {
                [DllImport("user32.dll")]
                private static extern void keybd_event(
                    byte virtualKey, byte scanCode, uint flags, UIntPtr extraInfo);

                public static void Toggle()
                {
                    keybd_event(0x5B, 0, 0, UIntPtr.Zero);
                    keybd_event(0x4E, 0, 0, UIntPtr.Zero);
                    keybd_event(0x4E, 0, 2, UIntPtr.Zero);
                    keybd_event(0x5B, 0, 2, UIntPtr.Zero);
                }
            }
          '@
            [ProbeNotificationCenter]::Toggle()
            Start-Sleep -Seconds 2
            Save-ProbeScreen 'target\windows11-notification-center.png'

            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $allElements = $root.FindAll(
              [System.Windows.Automation.TreeScope]::Descendants,
              [System.Windows.Automation.Condition]::TrueCondition)
            $expander = $allElements | Where-Object {
              $_.Current.Name -match '^\+\d+ notifications$'
            } | Select-Object -First 1
            if ($expander) {
              $invoke = [System.Windows.Automation.InvokePattern]$expander.GetCurrentPattern(
                [System.Windows.Automation.InvokePattern]::Pattern)
              $invoke.Invoke()
              Start-Sleep -Seconds 1
              Save-ProbeScreen 'target\windows11-notification-center-expanded.png'
            }
            $allElements = $root.FindAll(
              [System.Windows.Automation.TreeScope]::Descendants,
              [System.Windows.Automation.Condition]::TrueCondition)
            $centerEntries = @($allElements | Where-Object {
                $_.Current.Name -match 'Codex Notifier|Codex task finished|Codex needs approval|Open Codex'
              } | ForEach-Object {
                "Name=$($_.Current.Name) AutomationId=$($_.Current.AutomationId)"
              })
            if ($centerEntries.Count -eq 0) {
              $centerEntries = @('No matching accessible notification text')
            }
            Set-Content -Path target\windows11-notification-center.txt -Value $centerEntries
            [ProbeNotificationCenter]::Toggle()

            $database = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows\Notifications\wpndatabase.db'
            $sqlite = Get-Command sqlite3 -ErrorAction SilentlyContinue
            if ($sqlite -and (Test-Path -LiteralPath $database)) {
              & $sqlite.Source -readonly -header -column $database `
                "SELECT n.Id, n.ArrivalTime, CAST(n.Payload AS TEXT) AS Payload FROM Notification n JOIN NotificationHandler h ON h.RecordId=n.HandlerId WHERE h.PrimaryId='$aumid' ORDER BY n.ArrivalTime DESC LIMIT 5;" |
                Set-Content target\windows11-notifications.txt
            }
          }
          finally {
            & .github\scripts\windows-toast-probe-identity.ps1 `
              -Mode Remove `
              -ShortcutPath $shortcut
            if (Test-Path -LiteralPath $installDir) {
              Remove-Item -LiteralPath $installDir -Recurse -Force
            }
          }
          exit $exitCode

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-11-session-services
          path: target/windows11-*
          if-no-files-found: error

      - name: Require Windows smoke success
        if: steps.windows-smoke.outcome != 'success'
        run: exit 1

  macos:
    name: ${{ matrix.name }} notification UI service
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 14
            os: macos-14
          - name: macOS latest
            os: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Record untouched notification session
        shell: bash
        run: |
          set +e
          mkdir -p target
          uid="$(id -u)"
          {
            sw_vers
            uname -m
            id
            stat -f 'ConsoleUser=%Su ConsoleUid=%u' /dev/console
            echo 'Processes at clean start:'
            pgrep -lf 'WindowServer|loginwindow|NotificationCenter|UserNotificationCenter|usernotificationsd|usernoted'
            echo 'Disabled overrides at clean start:'
            launchctl print-disabled "gui/$uid"
            echo 'usernoted:'
            launchctl print "gui/$uid/com.apple.usernoted"
            echo 'usernotificationsd:'
            launchctl print "gui/$uid/com.apple.usernotificationsd"
            echo 'notificationcenterui.agent:'
            launchctl print "gui/$uid/com.apple.notificationcenterui.agent"
            echo 'UserNotificationCenterAgent:'
            launchctl print "gui/$uid/com.apple.UserNotificationCenterAgent"
          } >target/macos-session-services.txt 2>&1

      - name: Enable only Notification Center UI agent
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          agent='com.apple.notificationcenterui.agent'
          plist='/System/Library/LaunchAgents/com.apple.notificationcenterui.plist'
          if launchctl print-disabled "gui/$uid" |
            grep -q '"com.apple.notificationcenterui.agent" => disabled'; then
            echo disabled >target/macos-notificationcenterui-original-state.txt
            launchctl enable "gui/$uid/$agent"
          else
            echo enabled >target/macos-notificationcenterui-original-state.txt
          fi
          if ! launchctl print "gui/$uid/$agent" >/dev/null 2>&1; then
            launchctl bootstrap "gui/$uid" "$plist"
          fi
          launchctl kickstart -k "gui/$uid/$agent"
          sleep 3
          {
            echo 'Notification Center UI agent after isolated enable:'
            launchctl print "gui/$uid/$agent"
            echo 'Notification services after isolated enable:'
            launchctl print "gui/$uid" | grep -i -C 3 notificationcenterui
          } >>target/macos-session-services.txt 2>&1
          launchctl print "gui/$uid/$agent" >/dev/null

      - name: Prepare screen capture separately
        shell: bash
        run: |
          set +e
          screencapture -x target/macos-screen-preflight.png \
            2>target/macos-screen-preflight-error.txt
          echo 'screen-capture prompt handled in authorization loop' \
            >target/macos-screen-permission.txt
          sleep 1

      - name: Build macOS smoke executable and click helper
        shell: bash
        run: |
          cargo test -p codex-notifier-native-notification --test macos_smoke --no-run
          xcrun swiftc \
            .github/scripts/macos-probe-click.swift \
            -o target/macos-probe-click

      - name: Create temporary code-signing identity
        shell: bash
        run: |
          set -euo pipefail
          signing_directory="$RUNNER_TEMP/codex-notifier-signing"
          keychain="$RUNNER_TEMP/codex-notifier-probe.keychain-db"
          keychain_password='codex-notifier-probe'
          identity_name='Codex Notifier Probe Signing'
          mkdir -p "$signing_directory" target

          cat >"$signing_directory/root.cnf" <<'EOF'
          [req]
          distinguished_name = subject
          x509_extensions = extensions
          prompt = no

          [subject]
          CN = Codex Notifier Probe Root
          O = Codex Notifier Probe

          [extensions]
          basicConstraints = critical,CA:true
          keyUsage = critical,keyCertSign,cRLSign
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid:always
          EOF

          cat >"$signing_directory/leaf.cnf" <<'EOF'
          [req]
          distinguished_name = subject
          prompt = no

          [subject]
          CN = Codex Notifier Probe Signing
          OU = CODEXPRB01
          O = Codex Notifier Probe

          [extensions]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = codeSigning
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid,issuer
          EOF

          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -config "$signing_directory/root.cnf" \
            -keyout "$signing_directory/root.key" \
            -out "$signing_directory/root.pem"
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes -sha256 \
            -config "$signing_directory/leaf.cnf" \
            -keyout "$signing_directory/leaf.key" \
            -out "$signing_directory/leaf.csr"
          /usr/bin/openssl x509 -req -sha256 -days 1 \
            -in "$signing_directory/leaf.csr" \
            -CA "$signing_directory/root.pem" \
            -CAkey "$signing_directory/root.key" \
            -CAcreateserial \
            -extfile "$signing_directory/leaf.cnf" \
            -extensions extensions \
            -out "$signing_directory/leaf.pem"
          /usr/bin/openssl pkcs12 -export \
            -inkey "$signing_directory/leaf.key" \
            -in "$signing_directory/leaf.pem" \
            -certfile "$signing_directory/root.pem" \
            -out "$signing_directory/leaf.p12" \
            -passout "pass:$keychain_password"

          security list-keychains -d user >target/macos-original-keychains.txt
          login_keychain=$(security default-keychain -d user | tr -d '"')
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_directory/leaf.p12" \
            -k "$keychain" \
            -P "$keychain_password" \
            -T /usr/bin/codesign
          root_identity=$(/usr/bin/openssl x509 \
            -in "$signing_directory/root.pem" \
            -noout \
            -fingerprint \
            -sha1 | cut -d= -f2 | tr -d ':')
          {
            echo "CODEX_NOTIFIER_MACOS_SIGNING_KEYCHAIN=$keychain"
            echo "CODEX_NOTIFIER_MACOS_SIGNING_DIRECTORY=$signing_directory"
            echo "CODEX_NOTIFIER_MACOS_SIGNING_ROOT_IDENTITY=$root_identity"
          } >>"$GITHUB_ENV"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$signing_directory/root.pem" \
            >target/macos-signing-trust.txt 2>&1 &
          trust_pid=$!
          trust_result=''
          for attempt in $(seq 1 100); do
            if ! kill -0 "$trust_pid" 2>/dev/null; then
              set +e
              wait "$trust_pid"
              trust_result=$?
              set -e
              break
            fi
            sleep 0.1
          done
          if [[ -z "$trust_result" ]]; then
            kill "$trust_pid" 2>/dev/null || true
            wait "$trust_pid" 2>/dev/null || true
            echo 'System trust installation timed out' \
              >>target/macos-signing-trust.txt
            exit 1
          fi
          if [[ "$trust_result" -ne 0 ]]; then
            cat target/macos-signing-trust.txt
            exit "$trust_result"
          fi
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain" "$login_keychain"

          security find-identity -v -p codesigning "$keychain" \
            >target/macos-signing-identities.txt
          if ! grep -q "$identity_name" target/macos-signing-identities.txt; then
            cat target/macos-signing-identities.txt
            exit 1
          fi
          security find-certificate -a -Z -c "$identity_name" "$keychain" \
            >target/macos-signing-keychain-certificate.txt
          identity=$(/usr/bin/openssl x509 \
            -in "$signing_directory/leaf.pem" \
            -noout \
            -fingerprint \
            -sha1 | cut -d= -f2 | tr -d ':')
          if [[ -z "$identity" ]]; then
            cat target/macos-signing-identities.txt
            exit 1
          fi
          /usr/bin/openssl x509 \
            -in "$signing_directory/leaf.pem" \
            -noout \
            -subject \
            -issuer \
            -dates \
            -fingerprint \
            -sha256 \
            >target/macos-signing-certificate.txt
          {
            echo "CODEX_NOTIFIER_MACOS_SIGNING_IDENTITY=$identity"
          } >>"$GITHUB_ENV"

      - name: Exercise authorization and delivery
        id: macos-smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          CODEX_NOTIFIER_MACOS_SMOKE_ROOT=/Applications \
            CODEX_NOTIFIER_MACOS_SMOKE_RECOVER_AUTHORIZATION=1 \
            CODEX_NOTIFIER_MACOS_SIGNING_IDENTITY="$CODEX_NOTIFIER_MACOS_SIGNING_IDENTITY" \
            cargo test -p codex-notifier-native-notification \
            --test macos_smoke \
            displays_task_completion_and_approval_request_notifications \
            -- --ignored --exact --nocapture \
            >target/macos-smoke.log 2>&1 &
          smoke_pid=$!

          sleep 2
          screencapture -x target/macos-before.png \
            2>target/macos-before-error.txt
          notification_clicked=''
          banner_hovered=''
          banner_pressed=''
          screen_pressed=''
          settings_app_pressed=''
          settings_allow_pressed=''
          task_observed=''
          approval_observed=''
          for attempt in $(seq 1 80); do
            CODEX_PROBE_SCREENSHOT="$PWD/target/macos-permission-prompt.png" \
              CODEX_PROBE_SETTINGS_APP_SCREENSHOT="$PWD/target/macos-settings-app.png" \
              CODEX_PROBE_SETTINGS_ALLOW_SCREENSHOT="$PWD/target/macos-settings-allow.png" \
              CODEX_PROBE_TASK_SCREENSHOT="$PWD/target/macos-task-completed.png" \
              CODEX_PROBE_APPROVAL_SCREENSHOT="$PWD/target/macos-approval-requested.png" \
              CODEX_PROBE_CLICK_HELPER="$PWD/target/macos-probe-click" \
              CODEX_PROBE_NOTIFICATION_CLICKED="$notification_clicked" \
              CODEX_PROBE_BANNER_HOVERED="$banner_hovered" \
              CODEX_PROBE_BANNER_PRESSED="$banner_pressed" \
              CODEX_PROBE_SCREEN_PRESSED="$screen_pressed" \
              CODEX_PROBE_SETTINGS_APP_PRESSED="$settings_app_pressed" \
              CODEX_PROBE_SETTINGS_ALLOW_PRESSED="$settings_allow_pressed" \
              CODEX_PROBE_TASK_OBSERVED="$task_observed" \
              CODEX_PROBE_APPROVAL_OBSERVED="$approval_observed" \
              osascript >target/macos-ui-current.txt 2>&1 <<'APPLESCRIPT'
          tell application "System Events"
              set observations to ""
              set clickHelper to system attribute "CODEX_PROBE_CLICK_HELPER"
              set notificationClicked to system attribute "CODEX_PROBE_NOTIFICATION_CLICKED"
              set bannerHovered to system attribute "CODEX_PROBE_BANNER_HOVERED"
              set bannerPressed to system attribute "CODEX_PROBE_BANNER_PRESSED"
              set screenPressed to system attribute "CODEX_PROBE_SCREEN_PRESSED"
              set settingsAppPressed to system attribute "CODEX_PROBE_SETTINGS_APP_PRESSED"
              set settingsAllowPressed to system attribute "CODEX_PROBE_SETTINGS_ALLOW_PRESSED"
              set taskObserved to system attribute "CODEX_PROBE_TASK_OBSERVED"
              set approvalObserved to system attribute "CODEX_PROBE_APPROVAL_OBSERVED"
              repeat with candidateProcess in application processes
                  try
                      set processName to name of candidateProcess as text
                      if processName is "NotificationCenter" or (processName is "UserNotificationCenter" and screenPressed is not "1") or (processName is "System Settings" and bannerPressed is "1" and (settingsAllowPressed is not "1" or settingsAppPressed is not "1")) then
                          set observations to observations & " process=" & processName & " windows=" & (count windows of candidateProcess)
                          repeat with candidateWindow in windows of candidateProcess
                              set candidateElements to entire contents of candidateWindow
                              set windowText to ""
                              repeat with candidateElement in candidateElements
                                  try
                                      set windowText to windowText & " " & (name of candidateElement as text)
                                  end try
                                  try
                                      set windowText to windowText & " " & (value of candidateElement as text)
                                  end try
                              end repeat
                              set observations to observations & " text=" & windowText
                              if processName is "System Settings" and bannerPressed is "1" then
                                  if settingsAllowPressed is not "1" then
                                      repeat with candidateElement in candidateElements
                                          try
                                              set elementName to name of candidateElement as text
                                              set elementRole to role of candidateElement as text
                                              if elementName is "Allow notifications" and (elementRole is "AXCheckBox" or elementRole is "AXSwitch" or elementRole is "AXButton") then
                                                  set screenshotPath to system attribute "CODEX_PROBE_SETTINGS_ALLOW_SCREENSHOT"
                                                  do shell script "/usr/sbin/screencapture -x " & quoted form of screenshotPath
                                                  perform action "AXPress" of candidateElement
                                                  return "pressed=settings-allow process=" & processName & " role=" & elementRole
                                              end if
                                          end try
                                      end repeat
                                  end if
                                  if settingsAppPressed is not "1" then
                                      repeat with candidateElement in candidateElements
                                          try
                                              set elementName to name of candidateElement as text
                                              set elementRole to role of candidateElement as text
                                              if elementName contains "Codex Notifier" and (elementRole is "AXStaticText" or elementRole is "AXButton" or elementRole is "AXGroup") then
                                                  set screenshotPath to system attribute "CODEX_PROBE_SETTINGS_APP_SCREENSHOT"
                                                  do shell script "/usr/sbin/screencapture -x " & quoted form of screenshotPath
                                                  set elementPosition to position of candidateElement
                                                  set elementSize to size of candidateElement
                                                  set clickX to (item 1 of elementPosition) + ((item 1 of elementSize) div 2)
                                                  set clickY to (item 2 of elementPosition) + ((item 2 of elementSize) div 2)
                                                  do shell script quoted form of clickHelper & " click " & clickX & " " & clickY
                                                  return "pressed=settings-app process=" & processName & " role=" & elementRole & " x=" & clickX & " y=" & clickY
                                              end if
                                          end try
                                      end repeat
                                  end if
                              end if
                              if processName is "UserNotificationCenter" and windowText contains "screen and audio" then
                                  repeat with candidateElement in candidateElements
                                      try
                                          if screenPressed is not "1" and role of candidateElement is "AXButton" and name of candidateElement is "Allow" then
                                              set buttonPosition to position of candidateElement
                                              set buttonSize to size of candidateElement
                                              set clickX to (item 1 of buttonPosition) + ((item 1 of buttonSize) div 2)
                                              set clickY to (item 2 of buttonPosition) + ((item 2 of buttonSize) div 2)
                                              do shell script quoted form of clickHelper & " click " & clickX & " " & clickY
                                              return "pressed=screen-coordinate x=" & clickX & " y=" & clickY
                                          end if
                                      end try
                                  end repeat
                              end if
                              if processName is "NotificationCenter" then
                                  if taskObserved is not "1" and windowText contains "Codex task finished" then
                                      set screenshotPath to system attribute "CODEX_PROBE_TASK_SCREENSHOT"
                                      do shell script "/usr/sbin/screencapture -x " & quoted form of screenshotPath
                                      return "observed=task-completed process=" & processName
                                  end if
                                  if approvalObserved is not "1" and windowText contains "Codex needs approval" then
                                      set screenshotPath to system attribute "CODEX_PROBE_APPROVAL_SCREENSHOT"
                                      do shell script "/usr/sbin/screencapture -x " & quoted form of screenshotPath
                                      return "observed=approval-requested process=" & processName
                                  end if
                              end if
                              if processName is "NotificationCenter" and windowText contains "Codex Notifier" and windowText contains "Notifications" then
                                  repeat with candidateElement in candidateElements
                                      try
                                          if notificationClicked is not "1" and role of candidateElement is "AXButton" and name of candidateElement is "Allow" then
                                              set screenshotPath to system attribute "CODEX_PROBE_SCREENSHOT"
                                              do shell script "/usr/sbin/screencapture -x " & quoted form of screenshotPath
                                              set buttonPosition to position of candidateElement
                                              set buttonSize to size of candidateElement
                                              set clickX to (item 1 of buttonPosition) + ((item 1 of buttonSize) div 2)
                                              set clickY to (item 2 of buttonPosition) + ((item 2 of buttonSize) div 2)
                                              do shell script quoted form of clickHelper & " click " & clickX & " " & clickY
                                              return "granted=notification process=" & processName & " text=" & windowText
                                          end if
                                      end try
                                  end repeat
                                  repeat with candidateElement in candidateElements
                                      try
                                          set elementText to ""
                                          try
                                              set elementText to elementText & " " & (name of candidateElement as text)
                                          end try
                                          try
                                              set elementText to elementText & " " & (value of candidateElement as text)
                                          end try
                                          if bannerPressed is not "1" and (elementText contains "Codex Notifier" or elementText contains "Notifications may include") then
                                              set screenshotPath to system attribute "CODEX_PROBE_SCREENSHOT"
                                              do shell script "/usr/sbin/screencapture -x " & quoted form of screenshotPath
                                              set elementPosition to position of candidateElement
                                              set elementSize to size of candidateElement
                                              set clickX to (item 1 of elementPosition) + ((item 1 of elementSize) div 2)
                                              set clickY to (item 2 of elementPosition) + ((item 2 of elementSize) div 2)
                                              if bannerHovered is not "1" then
                                                  do shell script quoted form of clickHelper & " move " & clickX & " " & clickY
                                                  return "hovered=banner-coordinate process=" & processName & " x=" & clickX & " y=" & clickY & " element=" & elementText
                                              end if
                                              do shell script quoted form of clickHelper & " click " & clickX & " " & clickY
                                              return "pressed=banner-coordinate process=" & processName & " x=" & clickX & " y=" & clickY & " element=" & elementText
                                          end if
                                      end try
                                  end repeat
                              end if
                          end repeat
                      end if
                  on error errorMessage
                      set observations to observations & " process-error=" & errorMessage
                  end try
              end repeat
              return "notification Allow not found" & observations
          end tell
          APPLESCRIPT
            cat target/macos-ui-current.txt >target/macos-ui.txt
            cat target/macos-ui-current.txt >>target/macos-ui-history.txt
            if grep -q '^granted=notification' target/macos-ui-current.txt; then
              notification_clicked=1
              sleep 1
              continue
            fi
            if grep -q '^pressed=screen-coordinate' target/macos-ui-current.txt; then
              screen_pressed=1
              sleep 1
              continue
            fi
            if grep -q '^hovered=banner-coordinate' target/macos-ui-current.txt; then
              banner_hovered=1
              sleep 2
              continue
            fi
            if grep -q '^pressed=banner-coordinate' target/macos-ui-current.txt; then
              banner_pressed=1
              sleep 2
              continue
            fi
            if grep -q '^pressed=settings-app' target/macos-ui-current.txt; then
              settings_app_pressed=1
              sleep 2
              continue
            fi
            if grep -q '^pressed=settings-allow' target/macos-ui-current.txt; then
              settings_allow_pressed=1
              settings_app_pressed=1
              sleep 2
              continue
            fi
            if grep -q '^observed=task-completed' target/macos-ui-current.txt; then
              task_observed=1
              continue
            fi
            if grep -q '^observed=approval-requested' target/macos-ui-current.txt; then
              approval_observed=1
              continue
            fi
            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          screencapture -x target/macos-after.png \
            2>target/macos-after-error.txt

          result=''
          for attempt in $(seq 1 80); do
            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              wait "$smoke_pid"
              result=$?
              break
            fi
            sleep 0.5
          done
          if [[ -z "$result" ]]; then
            echo "Smoke timed out notification_clicked=$notification_clicked banner_hovered=$banner_hovered banner_pressed=$banner_pressed screen_pressed=$screen_pressed settings_app_pressed=$settings_app_pressed settings_allow_pressed=$settings_allow_pressed task_observed=$task_observed approval_observed=$approval_observed" >>target/macos-smoke.log
            kill "$smoke_pid" 2>/dev/null
            pkill -f codex-notifier-macos-smoke 2>/dev/null
            wait "$smoke_pid" 2>/dev/null
            result=124
          fi
          if [[ "$result" -eq 0 ]] && \
            { [[ "$task_observed" != 1 ]] || [[ "$approval_observed" != 1 ]]; }; then
            echo "Smoke lacked visible notification evidence task_observed=$task_observed approval_observed=$approval_observed" \
              >>target/macos-smoke.log
            result=125
          fi

          uid="$(id -u)"
          {
            echo 'Processes after authorization attempt:'
            pgrep -lf 'WindowServer|loginwindow|NotificationCenter|UserNotificationCenter|usernotificationsd|usernoted'
            echo 'usernoted after:'
            launchctl print "gui/$uid/com.apple.usernoted"
            echo 'usernotificationsd after:'
            launchctl print "gui/$uid/com.apple.usernotificationsd"
            echo 'notificationcenterui.agent after:'
            launchctl print "gui/$uid/com.apple.notificationcenterui.agent"
            echo 'UserNotificationCenterAgent after:'
            launchctl print "gui/$uid/com.apple.UserNotificationCenterAgent"
          } >>target/macos-session-services.txt 2>&1

          log show --last 4m --style compact \
            --predicate 'process == "codex-notifier-macos-smoke" OR process == "NotificationCenter" OR process == "UserNotificationCenter" OR process == "usernoted" OR process == "usernotificationsd" OR subsystem CONTAINS "UserNotifications"' \
            >target/macos-unified.log 2>&1 || true
          cat target/macos-ui.txt
          cat target/macos-smoke.log
          exit "$result"

      - name: Remove temporary code-signing identity
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${CODEX_NOTIFIER_MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CODEX_NOTIFIER_MACOS_SIGNING_KEYCHAIN"
          fi
          login_keychain=$(security default-keychain -d user | tr -d '"')
          if [[ -n "$login_keychain" ]]; then
            security list-keychains -d user -s "$login_keychain"
          fi
          if [[ -n "${CODEX_NOTIFIER_MACOS_SIGNING_ROOT_IDENTITY:-}" ]]; then
            sudo security delete-certificate \
              -Z "$CODEX_NOTIFIER_MACOS_SIGNING_ROOT_IDENTITY" \
              /Library/Keychains/System.keychain &
            certificate_cleanup_pid=$!
            for attempt in $(seq 1 50); do
              if ! kill -0 "$certificate_cleanup_pid" 2>/dev/null; then
                wait "$certificate_cleanup_pid" 2>/dev/null
                certificate_cleanup_pid=''
                break
              fi
              sleep 0.1
            done
            if [[ -n "$certificate_cleanup_pid" ]]; then
              kill "$certificate_cleanup_pid" 2>/dev/null
              wait "$certificate_cleanup_pid" 2>/dev/null
              echo 'System certificate cleanup timed out' \
                >>target/macos-signing-trust.txt
            fi
          fi
          if [[ -n "${CODEX_NOTIFIER_MACOS_SIGNING_DIRECTORY:-}" ]]; then
            rm -rf "$CODEX_NOTIFIER_MACOS_SIGNING_DIRECTORY"
          fi
          if grep -q '^disabled$' \
            target/macos-notificationcenterui-original-state.txt 2>/dev/null; then
            uid="$(id -u)"
            agent='com.apple.notificationcenterui.agent'
            launchctl bootout "gui/$uid/$agent" 2>/dev/null
            launchctl disable "gui/$uid/$agent"
            {
              echo 'Notification Center UI override after cleanup:'
              launchctl print-disabled "gui/$uid"
            } >>target/macos-session-services.txt 2>&1
          fi

      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-session-services
          path: target/macos-*
          if-no-files-found: error

      - name: Require macOS smoke success
        if: steps.macos-smoke.outcome != 'success'
        run: exit 1
